
name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r devsecops-p5-starter/requirements.txt

      
      - name: Compile Python files
        run: python -m compileall -q devsecops-p5-starter/app devsecops-p5-starter/tests


     
      - name: Run unit tests
        run: python -m unittest discover -s devsecops-p5-starter/tests -v


  sast-scan:
    name: SAST Scan and Quality Gate
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: python -m pip install bandit

      
      - name: Run Bandit SAST
        run: bandit -r devsecops-p5-starter/app -ll -ii -f txt
